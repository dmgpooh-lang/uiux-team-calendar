<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UIUX팀일정관리</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --border:#e5e7ee;
    --text:#1f2430;
    --muted:#8a90a2;
    --accent:#4f7cff;
    --radius:14px;
    --shadow:0 2px 10px rgba(20,20,40,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
  html{-webkit-text-size-adjust:100%;}

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  header.top h1{font-size:20px;margin:0;font-weight:700;}
  header.top .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c7cad4;margin-right:5px;}
  .status-dot.on{background:#3ecf8e;}

  .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .mini-filter{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .mini-chip{
    display:flex;align-items:center;gap:4px;
    padding:4px 8px 4px 7px;border-radius:14px;
    background:var(--card);border:1px solid var(--border);
    font-size:11.5px;font-weight:600;cursor:pointer;user-select:none;
  }
  .mini-chip.off{opacity:.35;}
  .mini-chip .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .mini-chip .del{color:var(--muted);font-size:10px;margin-left:1px;padding:0 1px;}
  .mini-chip .del:hover{color:#ff5470;}
  .mini-add{
    display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    border:1px dashed var(--border);color:var(--muted);
    cursor:pointer;font-size:14px;background:transparent;line-height:1;
  }
  .mini-add:hover{color:var(--accent);border-color:var(--accent);}

  .btn{
    border:none;
    background:var(--accent);
    color:#fff;
    padding:9px 14px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:transform .05s ease, opacity .15s ease;
  }
  .btn:hover{opacity:.92;}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:#ff5470;}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}


  .year-strip{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
    overflow:hidden;
  }
  .ys-head{
    display:flex;align-items:center;
    padding:10px 12px 6px;
    font-size:12.5px;font-weight:700;color:var(--muted);
  }
  .ys-year-dropdown{position:relative;display:inline-block;}
  .ys-year-btn{
    border:none;background:transparent;cursor:pointer;
    font-size:12.5px;font-weight:700;color:var(--muted);
    padding:4px 6px;border-radius:6px;
    display:inline-flex;align-items:center;gap:4px;
  }
  .ys-year-btn:hover{background:var(--bg);color:var(--text);}
  .ys-year-caret{font-size:10px;}
  .ys-year-panel{
    position:absolute;top:calc(100% + 4px);left:0;
    width:96px;max-height:170px;overflow-y:auto;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.14);
    display:none;z-index:30;
  }
  .ys-year-panel.open{display:block;}
  .ys-year-item{
    padding:9px 14px;font-size:13px;line-height:16px;font-weight:600;
    color:var(--text);text-align:center;cursor:pointer;
  }
  .ys-year-item:hover{background:var(--bg);}
  .ys-year-item.active{background:var(--accent);color:#fff;}
  .ys-months{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:0 10px 10px;
  }
  .ys-month{
    flex:1;min-width:36px;text-align:center;padding:7px 4px;border-radius:8px;
    font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;
  }
  .ys-month:hover{background:var(--bg);}
  .ys-month.active{background:var(--accent);color:#fff;}
  .ys-month .ys-dot{
    display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);
    margin:3px auto 0;opacity:0;
  }
  .ys-month.has-events .ys-dot{opacity:1;}
  .ys-month.active .ys-dot{background:#fff;}

  .calendar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
  .weekdays div{padding:10px 0;text-align:center;font-size:12px;font-weight:700;color:var(--muted);}
  .weekdays div:first-child{color:#ff6b7a;}
  .weekdays div:last-child{color:#4f7cff;}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cell{
    min-height:128px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:6px 6px 8px;
    position:relative;
    cursor:pointer;
    transition:background .1s ease;
  }
  .cell:hover{background:#fafbff;}
  .cell:nth-child(7n){border-right:none;}
  .cell .daynum-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
  .cell .daynum{font-size:12.5px;font-weight:600;color:var(--text);}
  .cell.other-month{background:#fbfbfd;}
  .cell.other-month .daynum{color:#c8cad6;}
  .cell.today .daynum{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--accent);color:#fff;
    width:20px;height:20px;border-radius:50%;
  }
  .cell.sun .daynum{color:#ff6b7a;}
  .cell.sat .daynum{color:#4f7cff;}
  .cell.holiday .daynum{color:#ff6b7a;}
  .holiday-label{
    font-size:9.5px;
    color:#ff6b7a;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:100%;
  }

  .evt{
    font-size:11px;
    padding:3px 7px;
    border-radius:6px;
    margin-bottom:3px;
    color:#fff;
    overflow:hidden;
    font-weight:600;
    border-left:3px solid rgba(255,255,255,.85);
    line-height:1.35;
  }
  .evt .evt-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .evt .evt-sub{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:9.5px;font-weight:500;opacity:.85;margin-top:1px;
  }
  .evt.status-done{opacity:.55;}
  .evt.status-done .evt-main{text-decoration:line-through;}
  .evt:hover{filter:brightness(0.92);}
  .more-link{font-size:10.5px;color:var(--muted);padding-left:2px;}

  .status-picker{display:flex;gap:6px;margin-top:4px;}
  .status-btn{
    flex:1;padding:8px 6px;border-radius:9px;border:1px solid var(--border);
    background:#fbfbfd;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .status-btn.sel{border-color:transparent;color:#fff;}
  .status-btn[data-status="계획"].sel{background:#94a3b8;}
  .status-btn[data-status="예정"].sel{background:#94a3b8;}
  .status-btn[data-status="진행중"].sel{background:#f59e0b;}
  .status-btn[data-status="완료"].sel{background:#22c55e;}

  /* view tabs */
  .view-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{
    border:1px solid var(--border);background:var(--card);color:var(--muted);
    padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
    box-shadow:var(--shadow);
  }
  .tab-btn.active{background:var(--accent);color:#fff;border-color:transparent;}

  /* projects view */
  .projects-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .projects-head h2{font-size:17px;margin:0 0 3px;}
  .projects-head .desc{color:var(--muted);font-size:12.5px;}
  .projects-toolbar{margin-bottom:14px;}
  .projects-toolbar input{
    width:100%;max-width:360px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;
    font-size:13px;font-family:inherit;background:var(--card);
  }
  .projects-toolbar input:focus{outline:2px solid var(--accent);outline-offset:0;background:#fff;}
  .project-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  .project-col{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px;}
  .project-col h3{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:6px;}
  .project-col h3 .count{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:auto;}
  .project-card{
    background:#fbfbfd;border:1px solid var(--border);border-left:4px solid #ccc;
    border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:background .1s;
  }
  .project-card:hover{background:#f3f5fb;}
  .project-card .p-name{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  .project-card .p-meta{font-size:11.5px;color:var(--muted);line-height:1.5;}
  .project-card .p-team{display:inline-flex;align-items:center;gap:4px;font-size:11px;margin-top:5px;color:var(--muted);}
  .project-card .p-team .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .project-card .p-memo{
    font-size:11px;color:var(--muted);margin-top:6px;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    line-height:1.4;
  }
  .project-card .p-related{font-size:11px;color:var(--accent);margin-top:6px;font-weight:600;}
  .project-card .p-ts{font-size:10px;color:#b6bac8;margin-top:6px;}
  .project-empty{color:var(--muted);font-size:12px;text-align:center;padding:20px 0;}
  @media (max-width:900px){
    .project-cols{grid-template-columns:1fr;}
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,35,.42);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:16px;padding:22px;width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
    max-height:90vh;overflow:auto;
  }
  .modal h2{font-size:16px;margin:0 0 16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input[type=text], .field textarea, .field select, .field input[type=date]{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;
    font-family:inherit;background:#fbfbfd;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:0;background:#fff;}
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px;}
  .modal-actions .right{display:flex;gap:8px;}
  .color-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
  .swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.sel{border-color:#1f2430;}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;}

  /* ===== Large monitors: give the calendar more breathing room ===== */
  @media (min-width:1440px){
    .wrap{max-width:1440px;}
    .cell{min-height:150px;padding:10px 10px 10px;}
    .cell .daynum{font-size:14px;}
    .evt{font-size:12.5px;padding:4px 8px;}
    .evt .evt-sub{font-size:10.5px;}
    header.top h1{font-size:23px;}
    .weekdays div{font-size:13px;padding:12px 0;}
    .holiday-label{font-size:10.5px;}
  }
  /* ===== 1920x1080 (primary large-monitor target) ===== */
  @media (min-width:1920px){
    .wrap{max-width:1820px;}
    .cell{min-height:185px;padding:12px 12px 12px;}
    .cell .daynum{font-size:15px;}
    .evt{font-size:13.5px;padding:5px 9px;}
    .evt .evt-sub{font-size:11px;}
    header.top h1{font-size:25px;}
    .weekdays div{font-size:14px;padding:13px 0;}
    .holiday-label{font-size:11.5px;}
    .project-cols{gap:20px;}
    .project-col{padding:18px;}
    .project-col h3{font-size:16px;}
    .project-card{padding:13px 15px;margin-bottom:12px;}
    .project-card .p-name{font-size:15px;}
    .project-card .p-meta{font-size:13px;}
    .ys-head{font-size:13.5px;padding:12px 14px;}
    .ys-month{font-size:13px;padding:9px 5px;}
  }

  /* ===== Tablet ===== */
  @media (max-width:900px){
    .wrap{padding:18px 14px 48px;}
  }

  /* ===== Mobile ===== */
  @media (max-width:640px){
    .wrap{padding:14px 10px 40px;}
    header.top{gap:8px;}
    header.top h1{font-size:16.5px;}
    header.top .sub{font-size:11.5px;}
    .btn{padding:8px 12px;font-size:12.5px;}
    .header-actions{gap:6px;width:100%;justify-content:space-between;}
    .mini-filter{gap:3px;}
    .mini-chip{font-size:9.5px;padding:3px 6px 3px 5px;}
    .mini-add{width:20px;height:20px;font-size:12px;}
    .projects-toolbar input{max-width:none;font-size:12px;padding:8px 10px;}
    .weekdays div{font-size:10.5px;padding:7px 0;}
    .cell{min-height:74px;padding:3px;}
    .cell .daynum{font-size:11px;}
    .cell.today .daynum{width:17px;height:17px;font-size:10.5px;}
    .holiday-label{font-size:8px;}
    .evt{font-size:8.5px;padding:2px 4px;border-left-width:2px;margin-bottom:2px;}
    .evt .evt-sub{display:none;}
    .more-link{font-size:8.5px;}
    .modal{padding:16px;max-width:none;width:100%;}
    footer{font-size:10.5px;}
    .view-tabs{gap:6px;}
    .tab-btn{padding:7px 12px;font-size:12px;}
    .projects-head h2{font-size:15px;}
    .projects-head .desc{font-size:11px;}
    .project-cols{gap:10px;}
    .project-col{padding:12px;}
    .project-col h3{font-size:12.5px;}
    .project-card{padding:8px 10px;margin-bottom:8px;}
    .project-card .p-name{font-size:12.5px;}
    .project-card .p-meta{font-size:10.5px;}
    .ys-head{padding:8px 10px;font-size:11px;}
    .ys-months{gap:3px;padding:0 8px 8px;}
    .ys-month{font-size:9.5px;padding:5px 2px;min-width:24px;}
  }

  @media (max-width:420px){
    .cell{min-height:64px;}
    .row2{flex-direction:column;gap:13px;}
    .status-btn{font-size:11px;padding:7px 4px;}
    .modal h2{font-size:15px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>📅 UIUX팀일정관리</h1>
      <div class="sub"><span id="statusDot" class="status-dot"></span><span id="statusText">연결 중…</span></div>
    </div>
    <div class="header-actions">
      <div class="mini-filter" id="miniTeamFilter"></div>
      <button class="btn" id="addEventBtn">+ 일정 추가</button>
    </div>
  </header>

  <div class="view-tabs" id="viewTabs">
    <button class="tab-btn active" data-view="calendar" id="tabCalendar">📅 캘린더</button>
    <button class="tab-btn" data-view="projects" id="tabProjects">📊 프로젝트 진행상황</button>
  </div>

  <div id="calendarView">
    <div class="year-strip" id="yearStrip"></div>

    <div class="calendar">
      <div class="weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div id="projectsView" style="display:none;">
    <div class="projects-head">
      <div>
        <h2>프로젝트 진행상황</h2>
        <div class="desc">진행중·예정·완료 상태를 한눈에 볼 수 있도록 모아뒀어요. 단발성 일정이 아닌, 꾸준히 진행되는 유지보수·장기 프로젝트를 관리해요.</div>
      </div>
      <button class="btn" id="addProjectBtn">+ 프로젝트 추가</button>
    </div>
    <div class="projects-toolbar">
      <input type="text" id="projectSearch" placeholder="🔍 프로젝트명, 발주처, 담당자로 검색">
    </div>
    <div class="project-cols" id="projectCols"></div>
  </div>

  <footer>
    이 캘린더는 로그인 없이 링크로 모두 공유돼요. 링크를 아는 팀원 누구나 일정을 추가·수정할 수 있어요.<br>
    협업 중인 팀의 일정을 함께 등록해서 조율해보세요 🙂
  </footer>
</div>

<!-- Event modal -->
<div class="overlay" id="eventOverlay">
  <div class="modal">
    <h2 id="modalTitle">일정 추가</h2>
    <div class="field">
      <label>프로젝트명</label>
      <input type="text" id="fProject" list="projectNameList" placeholder="예: OO 브랜드 리뉴얼 (등록된 프로젝트 중 선택 가능)">
      <datalist id="projectNameList"></datalist>
    </div>
    <div class="row2">
      <div class="field">
        <label>발주처 (선택)</label>
        <input type="text" id="fClient" placeholder="예: OO기업">
      </div>
      <div class="field">
        <label>담당자 (선택)</label>
        <input type="text" id="fManager" placeholder="예: 홍길동">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>시작일</label>
        <input type="date" id="fStart">
      </div>
      <div class="field">
        <label>종료일</label>
        <input type="date" id="fEnd">
      </div>
    </div>
    <div class="field">
      <label>담당 팀</label>
      <select id="fTeam"></select>
    </div>
    <div class="field">
      <label>진행 상태</label>
      <div class="status-picker" id="statusPicker">
        <button type="button" class="status-btn" data-status="계획">📝 계획</button>
        <button type="button" class="status-btn" data-status="진행중">⏳ 진행중</button>
        <button type="button" class="status-btn" data-status="완료">✅ 완료</button>
      </div>
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="fMemo" placeholder="장소, 참고 링크 등"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="deleteEventBtn" style="display:none;">삭제</button>
      <div class="right">
        <button class="btn ghost" id="cancelEventBtn">취소</button>
        <button class="btn" id="saveEventBtn">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- Team modal -->
<div class="overlay" id="teamOverlay">
  <div class="modal">
    <h2>팀 추가</h2>
    <div class="field">
      <label>팀 이름</label>
      <input type="text" id="tName" placeholder="예: 퍼블리싱">
    </div>
    <div class="field">
      <label>색상</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="right">
        <button class="btn ghost" id="cancelTeamBtn">취소</button>
        <button class="btn" id="saveTeamBtn">추가</button>
      </div>
    </div>
  </div>
</div>

<!-- Project modal -->
<div class="overlay" id="projectOverlay">
  <div class="modal">
    <h2 id="projectModalTitle">프로젝트 추가</h2>
    <div class="field">
      <label>프로젝트명</label>

const DEFAULT_COLORS = ["#4f7cff","#22b573","#ff9f43","#ff5470","#8b5cf6","#00b8d9","#e84393","#636e72"];

const STATUS_COLORS = {"계획":"#94a3b8","진행중":"#f59e0b","완료":"#22c55e"};

const PROJECT_COLS = [

let teams = [];      // {id, name, color}
let events = [];     // {id, title, start, end, teamId, memo, projectName, client, manager, status}
let projects = [];   // {id, name, client, manager, teamId, status, memo}

let current = new Date();
current.setDate(1);

let editingProjectId = null;

const teamsCol = collection(db, "teams");
const eventsCol = collection(db, "events");

/* ---------- Seed default teams once ---------- */
async function ensureSeedTeams(){
  const snap = await getDocs(teamsCol);

    await addDoc(teamsCol, {name:"디자인", color:"#4f7cff", order:0});

}

/* ---------- Realtime listeners ---------- */
onSnapshot(query(teamsCol, orderBy("order","asc")), (snap)=>{
  teams = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderMiniTeamFilter();
  populateTeamSelect();
  renderCalendar();
  renderProjects();

}, (err)=>{

});

onSnapshot(eventsCol, (snap)=>{
  events = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderCalendar();
  renderProjects();
});

onSnapshot(projectsCol, (snap)=>{
  projects = snap.docs.map(d=>({id:d.id, ...d.data()}));
  populateProjectDatalist();
  renderProjects();
});

ensureSeedTeams();

/* ---------- Mini team filter (헤더, 캘린더+프로젝트 공용) ---------- */
function renderMiniTeamFilter(){
  const bar = document.getElementById('miniTeamFilter');
  if(!bar) return;
  bar.innerHTML = '';
  teams.forEach(t=>{
    const chip = document.createElement('div');
    chip.className = 'mini-chip' + (activeFilters.has(t.id) ? ' off' : '');
    chip.innerHTML = `<span class="dot" style="background:${t.color}"></span><span>${escapeHtml(t.name)}</span><span class="del" data-id="${t.id}">✕</span>`;
    chip.addEventListener('click', (e)=>{
      if(e.target.classList.contains('del')) return;
      if(activeFilters.has(t.id)) activeFilters.delete(t.id); else activeFilters.add(t.id);
      renderMiniTeamFilter(); renderCalendar(); renderProjects();
    });
    chip.querySelector('.del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(confirm(`"${t.name}" 팀을 삭제할까요? 이 팀의 기존 일정·프로젝트는 유지되지만 팀 이름이 사라집니다.`)){
        await deleteDoc(doc(db, "teams", t.id));
      }
    });
    bar.appendChild(chip);
  });
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'mini-add';
  addBtn.textContent = '+';
  addBtn.title = '팀 추가';
  addBtn.addEventListener('click', openTeamModal);

/* ---------- Calendar rendering ---------- */
function pad(n){return String(n).padStart(2,'0');}
function toKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

function renderCalendar(){
  const y = current.getFullYear(), m = current.getMonth();

  const firstDay = new Date(y, m, 1);
  const startOffset = firstDay.getDay();
  const gridStart = new Date(y, m, 1 - startOffset);

  const todayKey = toKey(new Date());
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  for(let i=0;i<42;i++){
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    const key = toKey(d);
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(d.getMonth() !== m) cell.classList.add('other-month');
    if(key === todayKey) cell.classList.add('today');
    if(d.getDay()===0) cell.classList.add('sun');
    if(d.getDay()===6) cell.classList.add('sat');
    const holidayName = HOLIDAYS[key];
    if(holidayName) cell.classList.add('holiday');

    const numRow = document.createElement('div');
    numRow.className = 'daynum-row';
    const num = document.createElement('div');
    num.className = 'daynum';
    num.textContent = d.getDate();
    numRow.appendChild(num);
    cell.appendChild(numRow);

    if(holidayName){
      const hl = document.createElement('div');
      hl.className = 'holiday-label';
      hl.textContent = holidayName;
      hl.title = holidayName;
      cell.appendChild(hl);
    }

    const dayEvents = events
      .filter(ev => ev.teamId && !activeFilters.has(ev.teamId))
      .filter(ev => key >= ev.start && key <= (ev.end || ev.start))
      .sort((a,b)=> a.start.localeCompare(b.start));

    const maxShow = 2;
    dayEvents.slice(0,maxShow).forEach(ev=>{
      const team = teams.find(t=>t.id===ev.teamId);
      const chip = document.createElement('div');
      const statusClass = ev.status==='완료' ? ' status-done' : '';
      chip.className = 'evt' + statusClass;
      chip.style.background = team ? team.color : '#999';
      chip.style.borderLeftColor = STATUS_COLORS[ev.status] || 'rgba(255,255,255,.85)';

      const displayName = ev.projectName || ev.title || '(제목 없음)';

      const main = document.createElement('div');
      main.className = 'evt-main';
      main.textContent = (STATUS_ICONS[ev.status] || '') + displayName;
      chip.appendChild(main);

      if(ev.client){
        const sub = document.createElement('div');
        sub.className = 'evt-sub';
        sub.textContent = ev.client;
        chip.appendChild(sub);
      }

      const tooltipParts = [displayName];
      if(ev.client) tooltipParts.push('발주처: '+ev.client);
      if(ev.manager) tooltipParts.push('담당자: '+ev.manager);
      if(ev.status) tooltipParts.push('상태: '+ev.status);
      if(ev.memo) tooltipParts.push(ev.memo);
      chip.title = tooltipParts.join(' · ');

      chip.addEventListener('click', (e)=>{ e.stopPropagation(); openEventModal(ev); });
      cell.appendChild(chip);
    });
    if(dayEvents.length > maxShow){
      const more = document.createElement('div');
      more.className = 'more-link';
      more.textContent = `+${dayEvents.length - maxShow}개 더`;
      cell.appendChild(more);
    }

    cell.addEventListener('click', ()=> openEventModal(null, key));
    grid.appendChild(cell);
  }

  renderYearStrip();
}

/* ---------- Year strip (연도 드롭다운 선택 + 월 목록 상시 표시) ---------- */
const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const YEAR_MIN = 2020, YEAR_MAX = 2040;

function monthHasEvents(y, m){
  const first = `${y}-${pad(m+1)}-01`;
  const lastDay = new Date(y, m+1, 0).getDate();
  const last = `${y}-${pad(m+1)}-${pad(lastDay)}`;
  return events.some(ev => ev.start && ev.start <= last && (ev.end || ev.start) >= first);
}

function renderYearStrip(){
  const wrap = document.getElementById('yearStrip');
  if(!wrap) return;
  wrap.innerHTML = '';
  wrap.className = 'year-strip';
  const y = current.getFullYear();
  const activeMonth = current.getMonth();

  const head = document.createElement('div');
  head.className = 'ys-head';

  const dropdown = document.createElement('div');
  dropdown.className = 'ys-year-dropdown';

  const yearBtn = document.createElement('button');
  yearBtn.type = 'button';
  yearBtn.className = 'ys-year-btn';
  yearBtn.innerHTML = `${y}년 <span class="ys-year-caret">▾</span>`;
  dropdown.appendChild(yearBtn);

  const panel = document.createElement('div');
  panel.className = 'ys-year-panel';
  for(let yy = YEAR_MAX; yy >= YEAR_MIN; yy--){
    const item = document.createElement('div');
    item.className = 'ys-year-item' + (yy===y ? ' active' : '');
    item.textContent = `${yy}년`;
    item.addEventListener('click', (e)=>{
      e.stopPropagation();
      current.setFullYear(yy);
      renderCalendar();
    });
    panel.appendChild(item);
  }
  dropdown.appendChild(panel);

  yearBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const willOpen = !panel.classList.contains('open');
    document.querySelectorAll('.ys-year-panel.open').forEach(p=>p.classList.remove('open'));
    if(willOpen){
      panel.classList.add('open');
      const activeItem = panel.querySelector('.ys-year-item.active');
      if(activeItem) panel.scrollTop = activeItem.offsetTop;
    }
  });

  head.appendChild(dropdown);
  wrap.appendChild(head);

  const monthsRow = document.createElement('div');
  monthsRow.className = 'ys-months';
  MONTH_NAMES.forEach((label, m)=>{
    const el = document.createElement('div');
    el.className = 'ys-month' + (m===activeMonth ? ' active' : '') + (monthHasEvents(y,m) ? ' has-events' : '');
    el.innerHTML = `${label}<span class="ys-dot"></span>`;
    el.addEventListener('click', ()=>{
      current = new Date(y, m, 1);
      renderCalendar();
    });
    monthsRow.appendChild(el);
  });
  wrap.appendChild(monthsRow);
}

document.addEventListener('click', (e)=>{
  const openPanel = document.querySelector('.ys-year-panel.open');
  if(openPanel && !openPanel.parentElement.contains(e.target)){
    openPanel.classList.remove('open');
  }
});

/* ---------- Event modal ---------- */
const eventOverlay = document.getElementById('eventOverlay');
function populateTeamSelect(){
  const opts = teams.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
  ['fTeam','pTeam'].forEach(id=>{
    const sel = document.getElementById(id);
    const prev = sel.value;
    sel.innerHTML = opts;
    if(prev) sel.value = prev;

let selectedStatus = '계획';
function setSelectedStatus(status){
  selectedStatus = status;
  document.querySelectorAll('#statusPicker .status-btn').forEach(b=>{
    b.classList.toggle('sel', b.dataset.status === status);
  });
}
document.querySelectorAll('#statusPicker .status-btn').forEach(b=>{
  b.addEventListener('click', ()=> setSelectedStatus(b.dataset.status));
});

function openEventModal(ev, dateKey){
  editingEventId = ev ? ev.id : null;
  document.getElementById('modalTitle').textContent = ev ? '일정 수정' : '일정 추가';
  document.getElementById('fProject').value = ev ? (ev.projectName || ev.title || '') : '';
  document.getElementById('fClient').value = ev ? (ev.client || '') : '';
  document.getElementById('fManager').value = ev ? (ev.manager || '') : '';
  document.getElementById('fStart').value = ev ? ev.start : (dateKey || toKey(new Date()));
  document.getElementById('fEnd').value = ev ? (ev.end || ev.start) : (dateKey || toKey(new Date()));
  document.getElementById('fMemo').value = ev ? (ev.memo || '') : '';
  if(ev && ev.teamId) document.getElementById('fTeam').value = ev.teamId;
  setSelectedStatus(ev && ev.status ? ev.status : '계획');
  document.getElementById('deleteEventBtn').style.display = ev ? 'inline-block' : 'none';
  eventOverlay.classList.add('show');
  document.getElementById('fProject').focus();
}
function closeEventModal(){ eventOverlay.classList.remove('show'); editingEventId=null; }

document.getElementById('addEventBtn').addEventListener('click', ()=>{
  const now = new Date();
  const isCurrentMonth = current.getFullYear()===now.getFullYear() && current.getMonth()===now.getMonth();
  openEventModal(null, toKey(isCurrentMonth ? now : current));
});
document.getElementById('cancelEventBtn').addEventListener('click', closeEventModal);
eventOverlay.addEventListener('click', (e)=>{ if(e.target===eventOverlay) closeEventModal(); });

document.getElementById('saveEventBtn').addEventListener('click', async ()=>{
  const projectName = document.getElementById('fProject').value.trim();
  const client = document.getElementById('fClient').value.trim();
  const manager = document.getElementById('fManager').value.trim();
  let start = document.getElementById('fStart').value;
  let end = document.getElementById('fEnd').value;
  const teamId = document.getElementById('fTeam').value;
  const memo = document.getElementById('fMemo').value.trim();
  if(!projectName){ alert('프로젝트명을 입력해주세요.'); return; }
  if(!start){ alert('시작일을 선택해주세요.'); return; }
  if(!end || end < start) end = start;
  if(!teamId){ alert('먼저 팀을 추가해주세요.'); return; }

  const data = { projectName, client, manager, start, end, teamId, status: selectedStatus, memo };
  if(editingEventId){
    await updateDoc(doc(db,"events", editingEventId), data);
  } else {
    await addDoc(eventsCol, data);
  }
  closeEventModal();
});

document.getElementById('deleteEventBtn').addEventListener('click', async ()=>{
  if(!editingEventId) return;
  if(confirm('이 일정을 삭제할까요?')){
    await deleteDoc(doc(db,"events", editingEventId));
    closeEventModal();
  }
});

/* ---------- Team modal ---------- */
const teamOverlay = document.getElementById('teamOverlay');
let selectedColor = DEFAULT_COLORS[0];
function openTeamModal(){
  document.getElementById('tName').value='';
  selectedColor = DEFAULT_COLORS[teams.length % DEFAULT_COLORS.length];
  const row = document.getElementById('colorRow');
  row.innerHTML='';
  DEFAULT_COLORS.forEach(c=>{
    const sw = document.createElement('div');
    sw.className='swatch' + (c===selectedColor?' sel':'');
    sw.style.background=c;
    sw.addEventListener('click', ()=>{
      selectedColor=c;
      [...row.children].forEach(el=>el.classList.remove('sel'));
      sw.classList.add('sel');
    });
    row.appendChild(sw);
  });
  teamOverlay.classList.add('show');
  document.getElementById('tName').focus();
}
document.getElementById('cancelTeamBtn').addEventListener('click', ()=> teamOverlay.classList.remove('show'));
teamOverlay.addEventListener('click', (e)=>{ if(e.target===teamOverlay) teamOverlay.classList.remove('show'); });
document.getElementById('saveTeamBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('tName').value.trim();
  if(!name){ alert('팀 이름을 입력해주세요.'); return; }
  await addDoc(teamsCol, {name, color:selectedColor, order: teams.length});
  teamOverlay.classList.remove('show');
});

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- View tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    document.getElementById('calendarView').style.display = view==='calendar' ? '' : 'none';
    document.getElementById('projectsView').style.display = view==='projects' ? '' : 'none';
    document.getElementById('addEventBtn').style.display = view==='calendar' ? '' : 'none';
  });
});

/* ---------- Projects (프로젝트 진행상황) ---------- */
function populateProjectDatalist(){
  const dl = document.getElementById('projectNameList');
  if(!dl) return;
  const names = [...new Set(projects.map(p=>p.name).filter(Boolean))];
  dl.innerHTML = names.map(n=>`<option value="${escapeHtml(n)}"></option>`).join('');
}

function relativeTime(ts){
  if(!ts || typeof ts.toDate !== 'function') return null;
  const diffMs = Date.now() - ts.toDate().getTime();
  const diffMin = Math.floor(diffMs/60000);
  if(diffMin < 1) return '방금 업데이트';
  if(diffMin < 60) return `${diffMin}분 전 업데이트`;
  const diffH = Math.floor(diffMin/60);
  if(diffH < 24) return `${diffH}시간 전 업데이트`;
  const diffD = Math.floor(diffH/24);
  if(diffD < 30) return `${diffD}일 전 업데이트`;
  const diffMo = Math.floor(diffD/30);
  if(diffMo < 12) return `${diffMo}개월 전 업데이트`;
  const diffY = Math.floor(diffMo/12);
  return `${diffY}년 전 업데이트`;
}

function renderProjects(){
  const wrap = document.getElementById('projectCols');
  if(!wrap) return;
  const searchEl = document.getElementById('projectSearch');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  wrap.innerHTML = '';
  PROJECT_COLS.forEach(col=>{
    const list = projects
      .filter(p=>p.status===col.status)
      .filter(p=>!p.teamId || !activeFilters.has(p.teamId))
      .filter(p=>{
        if(!q) return true;
        const hay = [p.name, p.client, p.manager].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      })
      .sort((a,b)=> (a.name||'').localeCompare(b.name||''));
    const colEl = document.createElement('div');
    colEl.className = 'project-col';
    const h3 = document.createElement('h3');
    h3.innerHTML = `<span style="color:${PROJECT_STATUS_COLORS[col.status]}">●</span> ${col.label} <span class="count">${list.length}건</span>`;
    colEl.appendChild(h3);
    if(list.length===0){
      const empty = document.createElement('div');
      empty.className = 'project-empty';
      empty.textContent = q ? '검색 결과가 없어요' : '등록된 프로젝트가 없어요';
      colEl.appendChild(empty);
    }
    list.forEach(p=>{
      const team = teams.find(t=>t.id===p.teamId);
      const card = document.createElement('div');
      card.className = 'project-card';
      card.style.borderLeftColor = PROJECT_STATUS_COLORS[col.status];
      const metaParts = [];
      if(p.client) metaParts.push('발주처: '+p.client);
      if(p.manager) metaParts.push('담당자: '+p.manager);
      const nameEl = document.createElement('div');
      nameEl.className = 'p-name';
      nameEl.textContent = p.name;
      card.appendChild(nameEl);
      if(metaParts.length){
        const metaEl = document.createElement('div');
        metaEl.className = 'p-meta';
        metaEl.textContent = metaParts.join(' · ');
        card.appendChild(metaEl);
      }
      if(team){
        const teamEl = document.createElement('div');
        teamEl.className = 'p-team';
        teamEl.innerHTML = `<span class="dot" style="background:${team.color}"></span>${escapeHtml(team.name)}`;
        card.appendChild(teamEl);
      }
      if(p.memo){
        card.title = p.memo;
        const memoEl = document.createElement('div');
        memoEl.className = 'p-memo';
        memoEl.textContent = '📝 ' + p.memo;
        card.appendChild(memoEl);
      }
      const relatedCount = p.name ? events.filter(ev => ev.projectName && ev.projectName.trim().toLowerCase() === p.name.trim().toLowerCase()).length : 0;
      if(relatedCount > 0){
        const relEl = document.createElement('div');
        relEl.className = 'p-related';
        relEl.textContent = `📅 관련 일정 ${relatedCount}건`;
        card.appendChild(relEl);
      }
      const tsLabel = relativeTime(p.updatedAt || p.createdAt);
      if(tsLabel){
        const tsEl = document.createElement('div');
        tsEl.className = 'p-ts';
        tsEl.textContent = tsLabel;
        card.appendChild(tsEl);
      }
      card.addEventListener('click', ()=> openProjectModal(p));
      colEl.appendChild(card);
    });
    wrap.appendChild(colEl);
  });
}

const projectSearchEl = document.getElementById('projectSearch');
if(projectSearchEl) projectSearchEl.addEventListener('input', renderProjects);

const projectOverlay = document.getElementById('projectOverlay');
let selectedProjectStatus = '예정';
function setSelectedProjectStatus(status){
  selectedProjectStatus = status;
  document.querySelectorAll('#projectStatusPicker .status-btn').forEach(b=>{
    b.classList.toggle('sel', b.dataset.status === status);
  });
}
document.querySelectorAll('#projectStatusPicker .status-btn').forEach(b=>{
  b.addEventListener('click', ()=> setSelectedProjectStatus(b.dataset.status));
});

function openProjectModal(p){
  editingProjectId = p ? p.id : null;
  document.getElementById('projectModalTitle').textContent = p ? '프로젝트 수정' : '프로젝트 추가';
  document.getElementById('pName').value = p ? p.name : '';
  document.getElementById('pClient').value = p ? (p.client || '') : '';
  document.getElementById('pManager').value = p ? (p.manager || '') : '';
  document.getElementById('pMemo').value = p ? (p.memo || '') : '';
  if(p && p.teamId) document.getElementById('pTeam').value = p.teamId;
  setSelectedProjectStatus(p && p.status ? p.status : '예정');
  document.getElementById('deleteProjectBtn').style.display = p ? 'inline-block' : 'none';
  projectOverlay.classList.add('show');
  document.getElementById('pName').focus();
}
function closeProjectModal(){ projectOverlay.classList.remove('show'); editingProjectId=null; }

document.getElementById('addProjectBtn').addEventListener('click', ()=> openProjectModal(null));
document.getElementById('cancelProjectBtn').addEventListener('click', closeProjectModal);
projectOverlay.addEventListener('click', (e)=>{ if(e.target===projectOverlay) closeProjectModal(); });

document.getElementById('saveProjectBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('pName').value.trim();
  const client = document.getElementById('pClient').value.trim();
  const manager = document.getElementById('pManager').value.trim();
  const teamId = document.getElementById('pTeam').value;
  const memo = document.getElementById('pMemo').value.trim();
  if(!name){ alert('프로젝트명을 입력해주세요.'); return; }
  if(!teamId){ alert('먼저 팀을 추가해주세요.'); return; }

  const data = { name, client, manager, teamId, status: selectedProjectStatus, memo, updatedAt: serverTimestamp() };
  if(editingProjectId){
    await updateDoc(doc(db,"projects", editingProjectId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(projectsCol, data);
  }
  closeProjectModal();
});

document.getElementById('deleteProjectBtn').addEventListener('click', async ()=>{
  if(!editingProjectId) return;
  if(confirm('이 프로젝트를 삭제할까요?')){
    await deleteDoc(doc(db,"projects", editingProjectId));
    closeProjectModal();
  }
});

renderCalendar();
renderProjects();
</script>
</body>
</html>
